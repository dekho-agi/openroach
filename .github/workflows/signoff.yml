name: Sign-off

# pull_request_target and issue_comment run this workflow and its script as they
# stand on the default branch, main, so a pull request cannot change the check
# that judges it. The pull request's own code is never checked out or run here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [dev]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  statuses: write

jobs:
  signoff:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: A change to AGENTS.md carries an approver's lgtm
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: scripts/check-signoff.sh
