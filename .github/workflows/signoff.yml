name: Sign-off

# Both triggers run this file as it stands on main, so a pull request cannot
# change the check that judges it; its own code is never checked out here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [dev]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  statuses: write

jobs:
  check-lgtm:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: An approver has commented lgtm since the last push
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: scripts/check-signoff.sh
