name: Cleanup

# A branch that has merged into dev is done; new work starts on a new branch
# cut from dev. Only branches in this repository are deleted, never main or dev,
# and never a branch whose pull request closed without merging.
on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: write

jobs:
  delete-merged-branch:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-24.04
    steps:
      - name: Delete the merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api --method DELETE "repos/$REPO/git/refs/heads/$BRANCH"
